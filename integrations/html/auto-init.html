<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yogi_PLY — HTML Auto-Initialization Demo</title>
  <link rel="stylesheet" href="../../dist/yogi-ply.min.css">
  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #090b10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>HTML Auto-Initialization via <code>data-*</code> Attributes</h1>
    <p style="color:#8b9cff;">Created By Shiv Yogi — One Player. Every Website.</p>

    <!-- Auto-initialized container -->
    <div
      class="yogi-ply"
      data-video="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      data-poster="https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&w=1200&q=80"
      data-theme="liquid-glass"
      data-layout="cinematic">
    </div>
  </div>

  <!-- AutoInit will automatically discover .yogi-ply containers upon load -->
  <script src="../../dist/yogi-ply.js"></script>
</body>
</html>
