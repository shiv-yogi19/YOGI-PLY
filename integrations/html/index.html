<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yogi_PLY — Standard HTML Integration</title>
  
  <!-- Yogi_PLY Stylesheet -->
  <link rel="stylesheet" href="../../dist/yogi-ply.min.css">
  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    h1 {
      margin-bottom: 4px;
      font-size: 22px;
    }
    p {
      color: #8b9cff;
      margin-top: 0;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Standard HTML5 Player Integration</h1>
    <p>Created By Shiv Yogi — One Player. Every Website.</p>

    <!-- Target Element -->
    <div id="my-player"></div>
  </div>

  <!-- Yogi_PLY Library -->
  <script src="../../dist/yogi-ply.js"></script>
  <script>
    const player = new YogiPLY.Player('#my-player', {
      source: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
      poster: 'https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&w=1200&q=80',
      title: 'Big Buck Bunny (Cinematic)',
      theme: 'liquid-glass',
      layout: 'cinematic',
      aspectRatio: '16:9'
    });
  </script>
</body>
</html>
